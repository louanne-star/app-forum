.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:14px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:100vh}
.panel{background:rgba(25,45,61,.94);border:1px solid rgba(245,235,221,.22);border-radius:20px;box-shadow:0 8px 22px rgba(10,20,30,.4)}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:800;margin:0}
header.panel{width:100%;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(1.5rem,5vw,2rem)}
.sub{font-size:.95rem;color:var(--parch);font-weight:500}
.dots{display:flex;gap:8px}
.dots i{width:30px;height:7px;border-radius:4px;background:rgba(245,235,221,.22);transition:background .3s}
.dots i.on{background:var(--ok)}.dots i.cur{background:var(--ciel)}
.game{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.left{display:flex;flex-direction:column;align-items:center;gap:14px}
.target{width:min(46vw,190px);aspect-ratio:1;background:var(--ivoire);border-radius:22px;border:3px solid var(--parch);box-shadow:0 10px 24px rgba(10,20,30,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--petrole);overflow:hidden}
.target .q{font-family:'Fraunces',Georgia,serif;font-size:clamp(4rem,22vw,6.5rem);font-weight:800;line-height:1}
.target img{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
.target small{font-weight:700;color:var(--nuit);font-size:1.05rem;padding:5px 0 7px}
.target.win{box-shadow:0 0 0 5px var(--ok),0 0 26px 6px rgba(95,161,74,.55)}
.play{width:60px;height:60px;border-radius:50%;border:2px solid var(--ivoire);background:var(--petrole);color:var(--ivoire);display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 14px rgba(10,20,30,.45);transition:transform .15s,background .15s}
.play:hover{background:#34607a}.play:active{transform:scale(.94)}
.play:focus-visible,.card:focus-visible,.btn:focus-visible{outline:3px solid var(--ciel);outline-offset:3px}
.play.on{background:var(--turq);color:var(--nuit)}
.msg{min-height:36px}
.msg span{display:inline-block;padding:6px 18px;border-radius:999px;background:var(--ivoire);color:var(--ko);font-weight:700;font-size:1.05rem;opacity:0;transition:opacity .2s}
.msg span.show{opacity:1}
.grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{aspect-ratio:1;background:var(--ivoire);border:3px solid var(--parch);border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;color:var(--nuit);font:700 clamp(.8rem,2.4vw,1.05rem) 'Jost',system-ui,sans-serif;box-shadow:0 5px 12px rgba(10,20,30,.4);transition:transform .15s,box-shadow .2s}
.card img{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
.card span{padding:5px 0 6px}
.card:hover{transform:translateY(-2px)}
.card.ok{box-shadow:0 0 0 4px var(--ok),0 0 22px 6px rgba(95,161,74,.7)}
.card.ko{box-shadow:0 0 0 4px var(--ko),0 0 22px 6px rgba(196,67,47,.7);animation:shake .45s}
.card.done{opacity:.25;pointer-events:none;box-shadow:none}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (min-width:820px){
 .game{flex-direction:row;align-items:center;justify-content:center;gap:34px;flex:1}
 .left{flex:0 0 240px}
 .target{width:220px}.target .q{font-size:7rem}
 .grid{width:min(660px,calc((100vh - 160px)*1.5));flex:0 1 auto;gap:14px}
}
.over{position:fixed;inset:0;z-index:100;background:rgba(14,26,36,.55);display:grid;place-items:center;padding:20px}
.over[hidden]{display:none}
.over .panel{max-width:560px;padding:34px 36px;text-align:center}
.over h2{font-size:clamp(2.2rem,7vw,3.4rem);margin-bottom:6px}
.over .kick{color:var(--parch);font-weight:500;margin:0 0 16px}
.over p.t{margin:0 0 24px;line-height:1.55;font-size:1.1rem;color:var(--ivoire)}
.btn{background:var(--ivoire);color:var(--nuit);border:0;border-radius:999px;padding:14px 38px;font:700 1.15rem 'Jost',system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.4)}
.btn:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

var ITEMS=[{id:'mer',n:'Mer'},{id:'chaines',n:'Chaînes'},{id:'pioches',n:'Pioches'},{id:'moustiques',n:'Moustiques'},{id:'ecrire',n:'Écrire'},{id:'guillotine',n:'Guillotine'}];
var DUR={mer:3,chaines:3,pioches:3,moustiques:3,ecrire:3,guillotine:.94};
var $=function(i){return document.getElementById(i)};
var grid=$('grid'),target=$('target'),dots=$('dots'),msg=$('msg'),playBtn=$('play'),over=$('over');
var queue,cur,found,errors,busy,cards={},mt,pt,cache={},playing=null;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function nameOf(id){return ITEMS.filter(function(i){return i.id===id})[0].n}
function drawDots(){dots.innerHTML='';for(var i=0;i<6;i++){var d=document.createElement('i');if(i<found)d.className='on';else if(i===found)d.className='cur';dots.appendChild(d)}}
function playSound(){if(!cur)return;if(playing){playing.pause();playing.currentTime=0}var a=cache[cur]||(cache[cur]=new Audio(AUDIO[cur]));a.currentTime=0;playing=a;a.play().catch(function(){});playBtn.classList.add('on');clearTimeout(pt);pt=setTimeout(function(){playBtn.classList.remove('on')},DUR[cur]*1000)}
function say(show){msg.className=show?'show':''}

function newGame(){
  over.hidden=true;found=0;errors=0;busy=false;queue=shuffle(ITEMS.map(function(i){return i.id}));
  grid.innerHTML='';cards={};
  shuffle(ITEMS).forEach(function(it){var b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-label',it.n);b.innerHTML='<img src="'+IMG[it.id]+'" alt=""><span>'+it.n+'</span>';b.addEventListener('click',function(){pick(it.id)});grid.appendChild(b);cards[it.id]=b});
  next();
}
function next(){
  if(!queue.length){drawDots();return end()}
  cur=queue.pop();busy=false;target.className='target';target.innerHTML='<span class="q">?</span>';drawDots();say(false);
  setTimeout(playSound,500);
}
function pick(id){
  if(busy)return;var c=cards[id];
  if(id===cur){
    busy=true;c.classList.add('ok');say(false);
    var r=c.getBoundingClientRect(),tr=target.getBoundingClientRect();
    var cl=c.cloneNode(true);cl.style.cssText='position:fixed;z-index:60;margin:0;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;pointer-events:none;transform-origin:0 0';document.body.appendChild(cl);
    setTimeout(function(){c.classList.remove('ok');c.classList.add('done');
      var a=cl.animate([{transform:'none'},{transform:'translate('+(tr.left-r.left)+'px,'+(tr.top-r.top)+'px) scale('+(tr.width/r.width)+','+(tr.height/r.height)+')'}],{duration:650,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'});
      a.onfinish=function(){cl.remove();target.className='target win';target.innerHTML='<img src="'+IMG[id]+'" alt=""><small>'+nameOf(id)+'</small>';found++;drawDots();setTimeout(next,1300)};
    },450);
  }else{
    errors++;c.classList.remove('ko');void c.offsetWidth;c.classList.add('ko');say(true);
    clearTimeout(mt);mt=setTimeout(function(){c.classList.remove('ko');say(false)},1200);
  }
}
function showOver(t,k,p,b,fn){$('oT').textContent=t;$('oK').textContent=k;$('oP').textContent=p;var o=$('oB');o.textContent=b;o.onclick=fn;over.hidden=false;o.focus()}
function end(){
  var p=errors===0?'Sans la moindre erreur : tu as reconnu les six sons du bagne.':'Tu as reconnu les six sons du bagne, avec '+errors+(errors>1?' erreurs':' erreur')+'.';
  showOver('Bravo !','Nouville, Nouvelle-Calédonie',p,'Rejouer',newGame);
}
playBtn.addEventListener('click',playSound);
showOver('Memory sonore','Nouville, Nouvelle-Calédonie','Un son retentit : à toi de deviner ce que tu entends. Retrouve la carte qui lui correspond parmi les six illustrations. Si c’est la bonne, elle vient se poser sur le « ? » ; sinon, réessaie. Touche le haut-parleur pour réécouter le son, et pense à monter le volume.','Commencer',newGame);
})();
