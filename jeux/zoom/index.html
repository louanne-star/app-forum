<title>Plein cadre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Même univers que « Le tri du bagne » : scène peinte, bandeau bleu nuit. Jeu : grande loupe à gauche, questions à droite (empilées en portrait). Look clair unique. */
:root{
  --navy:#192D3D;
  --petrole:#29485B;
  --cream:#F5EBDD;
  --parchemin:#DCC9A6;
  --paper:#FBF6EE;
  --ink:#192D3D;
  --muted:#4F5B63;
  --gold:#B95F43;
  --good:#587C4A;
  --bad:#9E3B26;
  --font-ui:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:#9FCBE6;color:var(--ink);font-family:var(--font-ui);font-size:16px;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #48B8C5;outline-offset:3px}
.scene{display:none}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center;background-size:cover}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(25,45,61,.10),rgba(25,45,61,.28))}

.topbar{position:relative;z-index:30;flex-shrink:0;background:var(--navy);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:1400px;margin:0 auto;height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-title{font-weight:900;font-size:clamp(18px,2.2vw,24px);line-height:1}
.logo-sub{font-size:11px;font-weight:700;letter-spacing:.28em;opacity:.8;margin-top:4px;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:16px}
.pts{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:8px}
.pts b{background:var(--cream);color:var(--navy);border-radius:999px;padding:3px 12px}
.btn-quit{height:44px;padding:0 20px;border-radius:22px;border:2px solid #fff;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.btn-quit:hover{background:rgba(255,255,255,.12)}
@media (max-width:560px){.logo-sub{display:none}.pts span{display:none}}

.app{position:relative;z-index:10;flex:1;min-height:0;width:100%;max-width:1400px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{background:rgba(251,246,238,.97);border:1px solid rgba(25,45,61,.08);border-radius:24px;box-shadow:0 30px 60px -30px rgba(25,45,61,.6)}
.btn{height:56px;padding:0 28px;border-radius:28px;border:0;cursor:pointer;font-weight:900;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--navy);color:#fff;box-shadow:0 4px 0 #0F1C27}
.btn-ghost{background:#fff;color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#B95F43}

/* Accueil */
.start{align-items:center;justify-content:center;padding-block:24px;overflow:auto}
.start .panel{width:100%;max-width:820px;box-sizing:border-box;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,40px);align-items:center}
.teaser{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;border:10px solid #fff;box-shadow:0 0 0 4px var(--navy),0 24px 40px -20px rgba(25,45,61,.6);animation:bob 4s ease-in-out infinite}
.teaser .img{position:absolute;inset:0;transform-origin:0 0;animation:peek 9s ease-in-out infinite}
.teaser .img svg,.teaser .img img{width:133%;height:100%;display:block;object-fit:cover}
.teaser-handle{position:absolute;right:-6%;bottom:-6%;width:30%;height:10%;background:var(--navy);border-radius:999px;transform:rotate(45deg);transform-origin:left center}
@keyframes peek{0%,100%{transform:translate(-40%,-30%) scale(2.2)}33%{transform:translate(-120%,-80%) scale(3)}66%{transform:translate(-20%,-90%) scale(2.6)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.start h1{margin:6px 0 0;font-weight:900;font-size:clamp(38px,6vw,68px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:14px 0 0;font-size:clamp(16px,1.8vw,19px);line-height:1.45;color:var(--muted)}
.rules{margin:18px 0 22px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:baseline;font-weight:700}
.rules b{flex-shrink:0;min-width:34px;text-align:center;background:var(--cream);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
@media (max-width:720px){.start .panel{grid-template-columns:1fr}.teaser{width:min(240px,70%);margin:0 auto}}

/* Jeu */
.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:clamp(16px,2.5vw,32px);align-items:center;padding-block:clamp(14px,3vh,32px)}
.viewer-wrap{position:relative;min-width:0;display:flex;justify-content:center;max-height:100%}
.viewer{position:relative;width:100%;max-width:calc((100vh - 72px - 64px) * 4 / 3);aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:#fff;border:10px solid #fff;box-sizing:border-box;box-shadow:0 30px 50px -24px rgba(25,45,61,.65)}
.viewer .img{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.viewer .img svg,.viewer .img img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.viewer::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;transition:opacity .8s;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(25,45,61,.28) 100%)}
.viewer.revealed::after{opacity:0}
.zoom-chip{position:absolute;z-index:2;top:20px;left:20px;display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;font-weight:900;font-size:15px;padding:6px 12px 6px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.side{min-width:0;padding:clamp(18px,2.5vw,28px);display:flex;flex-direction:column;gap:16px}
.round{display:flex;align-items:center;justify-content:space-between;gap:12px}
.round-dots{display:flex;gap:6px}
.round-dots i{width:10px;height:10px;border-radius:5px;background:#E3D8C1}
.round-dots i.done{background:var(--navy)}
.round-dots i.now{width:24px;background:var(--gold)}
.side h2{margin:0;font-size:clamp(24px,2.6vw,32px);font-weight:900;line-height:1.05}
.worth{margin:-8px 0 0;font-weight:700;color:var(--muted)}
.worth b{color:var(--ink)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{min-height:64px;padding:10px 14px;border-radius:16px;border:0;background:#fff;color:var(--navy);font-weight:800;font-size:16px;line-height:1.2;cursor:pointer;text-align:left;
  box-shadow:0 0 0 2px #E3D8C1 inset,0 3px 0 #E3D8C1;transition:transform .15s,box-shadow .15s,background .2s}
.ans:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 0 2px var(--navy) inset,0 3px 0 var(--navy)}
.ans:disabled{cursor:default}
.ans.good{background:var(--good);color:#fff;box-shadow:0 3px 0 #1D5230}
.ans.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 #7A2516;text-decoration:line-through}
.ans.dim{opacity:.45}
.unzoom{align-self:flex-start;height:46px;padding:0 18px;border-radius:23px;border:0;background:var(--cream);color:var(--navy);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.unzoom:hover:not(:disabled){background:#EFE2C6}
.unzoom:disabled{opacity:.4;cursor:default}
.feedback{border-radius:18px;background:var(--cream);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.feedback .verdict{font-weight:900;font-size:20px}
.feedback .verdict.ok{color:var(--good)}
.feedback .verdict.ko{color:var(--bad)}
.feedback p{margin:0;font-size:16px;line-height:1.45;color:#2A3A45}
.feedback .sk{font-weight:900}
@media (max-width:980px),(orientation:portrait){
  .game{grid-template-columns:1fr;align-content:start;overflow:auto}
  .viewer{max-width:100%}
}
@media (max-width:480px){.answers{grid-template-columns:1fr}}

/* Fin */
.end{overflow:auto;padding-block:24px 32px}
.end .panel{padding:clamp(20px,3.5vw,40px);display:flex;flex-direction:column;gap:28px}
.score-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.score{font-weight:900;font-size:clamp(68px,10vw,120px);line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:8px}
.score small{font-size:.4em;color:var(--muted);letter-spacing:0}
.end-verdict{margin:12px 0 0;font-size:clamp(18px,2vw,23px);font-weight:800;max-width:32ch;text-wrap:balance}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.rc{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 0 #E6DCC6;min-width:0}
.rc .thumb{aspect-ratio:4/3}
.rc .thumb svg,.rc .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.rc-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rc-name{font-weight:900;font-size:19px;line-height:1.1}
.rc-pts{flex-shrink:0;font-weight:900;font-size:14px;padding:3px 10px;border-radius:999px;background:#DCEBDF;color:#24532E}
.rc-pts.zero{background:#F6DCD6;color:#8A2E1C}
.rc p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .viewer .img,.viewer::after,.ans,.btn{transition:none}
  .teaser,.teaser .img{animation:none}
}
</style>

<div class="bg" id="bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo">
      
      <div>
        <div class="logo-title">Plein cadre</div>
        <div class="logo-sub">LES DÉTAILS DU BAGNE</div>
      </div>
    </div>
    <div class="top-right">
      <div class="pts" id="pts" hidden><span>Score</span><b id="ptsVal">0</b></div>
      <button class="btn-quit" id="btnHome" type="button" hidden>Quitter</button>
    </div>
  </div>
</header>

<div class="app">
  <section class="screen start" id="start">
    <div class="panel">
      <div class="teaser" aria-hidden="true"><div class="img" id="teaserImg"></div><span class="teaser-handle"></span></div>
      <div>
        <div class="eyebrow">Site historique de l'île Nou</div>
        <h1>Plein cadre</h1>
        <p class="lede" style="margin-bottom:26px">Regarde bien chaque image et essaie de trouver ce qui s'y cache.</p>
        <button class="btn btn-primary" id="btnStart" type="button">Commencer
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="game">
      <div class="viewer-wrap">
        <div class="viewer" id="viewer" role="img" aria-label="Détail zoomé d'une image du bagne">
          <div class="img" id="img"></div>
          <div class="zoom-chip" id="zoomChip">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/></svg>
            <span id="zoomVal">× 6</span>
          </div>
        </div>
      </div>
      <div class="side panel">
        <div class="round"><span class="eyebrow" id="roundText">Manche 1 / 5</span><div class="round-dots" id="dots"></div></div>
        <h2 id="question">Qu'est-ce que c'est ?</h2>
        <p class="worth" id="worth">Réponds maintenant pour gagner <b>3 points</b>.</p>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" hidden></div>
      </div>
    </div>
  </section>

  <section class="screen end" id="end" hidden></section>
</div>

    setZoom((q.levels || LEVELS)[0], q.focus, true);
    $('#roundText').textContent = 'Manche ' + (r + 1) + ' / ' + order.length;
    $('#dots').innerHTML = order.map((_, j) => '<i class="' + (j < r ? 'done' : j === r ? 'now' : '') + '"></i>').join('');
    $('#question').textContent = "Qu'est-ce que c'est ?";
    updateWorth();
    const ans = $('#answers');
    ans.innerHTML = '';
    shuffle(q.options).forEach(opt => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ans'; b.textContent = opt;
      b.addEventListener('click', () => answer(opt, b));
      ans.appendChild(b);
    });
    $('#feedback').hidden = true;
  }

  function updateWorth(afterMiss){
    const p = 3 - level;
    $('#worth').innerHTML = (afterMiss ? 'Raté ! L\'image se dézoome un peu. ' : '') +
      'Essai ' + (level + 1) + ' sur 3 : une bonne réponse vaut <b>' + p + ' point' + (p > 1 ? 's' : '') + '</b>.';
  }

  function answer(opt, btn){
    if (done) return;
    const q = order[r];
    const ok = opt === q.answer;
    if (!ok && level < LEVELS.length - 1){
      btn.disabled = true;
      btn.classList.add('bad');
      if (!reduce) btn.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:300});
      level++;
      setZoom((q.levels || LEVELS)[level], q.focus);
      updateWorth(true);
      return;
    }
    done = true;
    const pts = ok ? 3 - level : 0;
    score += pts;
    results.push({q, pts});
    $('#ptsVal').textContent = score;
    [...$('#answers').children].forEach(b => {
      b.disabled = true;
      if (b.textContent === q.answer) b.classList.add('good');
      else if (b === btn || b.classList.contains('bad')) b.classList.add('bad');
      else b.classList.add('dim');
    });
    setZoom(1, q.focus);
    viewer.classList.add('revealed');
    $('#question').textContent = q.answer;
    $('#worth').innerHTML = ok ? 'Bien vu ! <b>+' + pts + ' point' + (pts > 1 ? 's' : '') + '</b>' : 'Plus d\'essai… voici l\'image en entier.';
    const last = r === order.length - 1;
    const fb = $('#feedback');
    fb.innerHTML = '<div class="verdict ' + (ok ? 'ok' : 'ko') + '">' + (ok ? 'Bonne réponse !' : 'Perdu ! C\'était ' + q.answer.charAt(0).toLowerCase() + q.answer.slice(1) + '.') + '</div>' +
      '<p><span class="sk">Le savais-tu ?</span> ' + q.info + '</p>' +
      '<button class="btn btn-primary" type="button" id="btnNext">' + (last ? 'Voir mon score' : 'Manche suivante') + '</button>';
    fb.hidden = false;
    $('#btnNext').addEventListener('click', () => { if (last) showEnd(); else { r++; renderRound(); } });
    setTimeout(() => { const n = $('#btnNext'); if (n) n.focus({preventScroll:true}); }, reduce ? 0 : 900);
  }

  function verdict(s, t){
    if (s === t) return "Œil de lynx ! Rien ne t'échappe.";
    if (s >= t * .7) return 'Très bon coup d\'œil, bravo.';
    if (s >= t * .4) return 'Pas mal ! Certains détails t\'ont trompé.';
    return 'Le bagne cache bien ses secrets. Retente ta chance !';
  }

  function showEnd(){
    const t = order.length * 3;
    end.innerHTML = '<div class="panel"><div class="score-head"><div><div class="eyebrow">Fin de la partie</div>' +
      '<div class="score">' + score + ' <small>/ ' + t + '</small></div><p class="end-verdict">' + verdict(score, t) + '</p></div>' +
      '<div class="actions"><button class="btn btn-primary" type="button" id="btnAgain">Rejouer</button><button class="btn btn-ghost" type="button" id="btnBack">Accueil</button></div></div>' +
      '<div class="recap">' + results.map(x => '<article class="rc"><div class="thumb">' + visOf(x.q) + '</div><div class="rc-body"><div class="rc-top"><div class="rc-name">' + x.q.answer + '</div>' +
        '<span class="rc-pts' + (x.pts ? '' : ' zero') + '">' + (x.pts ? '+' + x.pts + ' pt' + (x.pts > 1 ? 's' : '') : '0 pt') + '</span></div><p>' + x.q.info + '</p></div></article>').join('') + '</div></div>';
    show(end);
    end.scrollTop = 0;
    $('#btnAgain').addEventListener('click', newGame);
    $('#btnBack').addEventListener('click', () => show(start));
  }

  $('#btnStart').addEventListener('click', newGame);
  $('#btnHome').addEventListener('click', () => show(start));
})();
</script>
